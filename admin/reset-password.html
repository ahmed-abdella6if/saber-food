<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="Reset Password | Saber Food">Reset Password | Saber Food</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
<link href="css/admin.css" rel="stylesheet"/>
<link href="css/login.css" rel="stylesheet"/>
<link href="../css/i18n.css" rel="stylesheet"/>
</head>
<body>
<div class="lang-switcher" id="langSwitcher">
<button aria-label="Change language" class="lang-switcher-toggle" id="langSwitcherToggle" type="button"><i class="fa-solid fa-globe"></i><span class="lang-switcher-current" id="langSwitcherCurrent">EN</span></button>
<div class="lang-switcher-menu" id="langSwitcherMenu">
<button data-lang="en" type="button">English</button>
<button data-lang="it" type="button">Italiano</button>
<button data-lang="ar" type="button">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</button>
</div>
</div>

<div class="login-page">
<div class="login-card">
<div class="login-logo">
<i class="fa-solid fa-key"></i>
<h1 data-i18n="Reset Password">Reset Password</h1>
<p data-i18n="Create a new password">Create a new password</p>
</div>
<form id="resetForm">
<div class="input-group">
<label data-i18n="New Password">New Password</label>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input data-i18n-placeholder="New Password" id="password" placeholder="New Password" required="" type="password"/>
</div>
</div>
<div class="input-group">
<label data-i18n="Confirm Password">Confirm Password</label>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input data-i18n-placeholder="Confirm Password" id="confirmPassword" placeholder="Confirm Password" required="" type="password"/>
</div>
</div>
<button class="login-btn" data-i18n="Update Password" type="submit">

                Update Password

            </button>
<div class="login-message" id="message">
</div>
</form>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/reset-password.js"></script>
<script src="../js/i18n-data.js"></script>
<script src="../js/i18n.js"></script>
</body>
</html>
